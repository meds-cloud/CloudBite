
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudBite - Food Ordering</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🍔 CloudBite</h1>
    <p>Fresh food, delivered with love!</p>
</header>

<main>
    <h2>Place Your Order</h2>

    <form id="orderForm">

        <h3>Customer Details</h3>

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Your name" required>

        <label>Mobile Number</label>
        <input type="tel" id="phone" placeholder="10-digit mobile number"
               pattern="[0-9]{10}" required>

        <label>Email Address</label>
        <input type="email" id="email" placeholder="Your email" required>

        <h3>Delivery Address</h3>

        <label>House / Flat / Street Address</label>
        <textarea id="address" placeholder="Enter complete address" required></textarea>

        <label>City</label>
        <input type="text" id="city" placeholder="Enter city" required>

        <label>PIN Code</label>
        <input type="text" id="pincode" placeholder="6-digit PIN code"
               pattern="[0-9]{6}" required>

        <label>Landmark (Optional)</label>
        <input type="text" id="landmark" placeholder="Nearby landmark">

        <h3>Food Selection</h3>

        <label>Select Food</label>
        <select id="item">
            <option value="Pizza" data-price="199">Pizza - ₹199</option>
            <option value="Burger" data-price="99">Burger - ₹99</option>
            <option value="Pasta" data-price="149">Pasta - ₹149</option>
            <option value="Sandwich" data-price="79">Sandwich - ₹79</option>
        </select>

        <label>Quantity</label>
        <input type="number" id="quantity" min="1" max="20" value="1" required>

        <label>Special Instructions (Optional)</label>
        <textarea id="instructions"
                  placeholder="Less spicy, extra cheese, etc."></textarea>

        <h3>Payment Details</h3>

        <label>Payment Method</label>
        <select id="payment">
            <option value="Cash on Delivery">Cash on Delivery</option>
        </select>

        <div class="bill">
            <h3>Order Summary</h3>
            <p id="summary">Pizza × 1</p>
            <h2 id="total">Total: ₹199</h2>
        </div>

        <button type="submit">Confirm Order</button>

    </form>

    <div id="message"></div>

</main>

<script src="script.js"></script>
</body>
</html>
